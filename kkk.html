<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chúc Mừng Năm Mới 2026 - Trân</title>

<!-- Font pixel có hỗ trợ tiếng Việt -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    image-rendering: pixelated;
}

body {
    font-family: 'Pixelify Sans', monospace;
    background: linear-gradient(135deg, #0c0e1a 0%, #1a1f2e 50%, #2a2340 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;

    /* ÉP PIXEL */
    -webkit-font-smoothing: none;
    font-smooth: never;
    letter-spacing: 1px;
}

/* Nền pixel màu sắc hơn */
.pixel-background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: 
        radial-gradient(circle at 20% 30%, rgba(255, 154, 118, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(255, 209, 102, 0.08) 0%, transparent 50%),
        repeating-linear-gradient(
            45deg,
            #1a1f2e 0 8px,
            #242d45 8px 16px,
            #2a3450 16px 24px,
            #1d2234 24px 32px
        );
}

/* Canvas pháo hoa pixel */
#pixel-fireworks {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    image-rendering: pixelated;
}

.container {
    max-width: 820px;
    width: 100%;
    text-align: center;
}

/* Title */
.new-year-title {
    font-size: 2rem;
    color: #4ecdc4;
    text-shadow: 3px 3px #1d5561;
    margin-bottom: 18px;
    letter-spacing: 3px;
    position: relative;
}

/* 2026 */
.big-2026 {
    font-size: 3.6rem;
    color: #ff9a76;
    text-shadow: 4px 4px #cc6b4e;
    margin-bottom: 24px;
    letter-spacing: 5px;
    animation: pulse 2s infinite;
    position: relative;
}

@keyframes pulse {
    0%,100% {transform: scale(1);}
    50% {transform: scale(1.05);}
}

/* Khung pixel */
.pixel-frame {
    background: #2a3450;
    border: 6px solid #4ecdc4;
    padding: 22px 14px;
    box-shadow: 0 6px #1d5561;
    margin-bottom: 26px;
    position: relative;
    overflow: hidden;
}

.pixel-frame::before {
    content: "";
    position: absolute;
    top: -10px;
    left: -10px;
    right: -10px;
    bottom: -10px;
    background: linear-gradient(45deg, #ff9a76, #4ecdc4, #ffd166, #06d6a0);
    z-index: -1;
    filter: blur(15px);
    opacity: 0.3;
}

/* Typewriter */
.typewriter {
    font-size: 1.25rem;
    line-height: 1.8;
}

.typewriter-text {
    border-right: 3px solid #4ecdc4;
    animation: caret 0.8s infinite;
}

@keyframes caret {
    50% { border-color: transparent; }
}

.name-highlight {
    color: #ffd166;
    text-shadow: 2px 2px #b58c2a;
    animation: nameGlow 2s infinite alternate;
}

@keyframes nameGlow {
    from { text-shadow: 2px 2px #b58c2a; }
    to { text-shadow: 2px 2px #b58c2a, 0 0 10px #ffd166; }
}

/* Countdown */
.pixel-countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.countdown-item {
    background: #2a3450;
    border: 4px solid #4ecdc4;
    padding: 10px 12px;
    min-width: 72px;
    box-shadow: 0 4px #1d5561;
    position: relative;
    overflow: hidden;
}

.countdown-item::after {
    content: "";
    position: absolute;
    top: -5px;
    left: -5px;
    right: -5px;
    bottom: -5px;
    background: linear-gradient(45deg, #ff9a76, #4ecdc4);
    z-index: -1;
    filter: blur(8px);
    opacity: 0.2;
}

.countdown-value {
    font-size: 1.6rem;
    color: #ff9a76;
}

.countdown-label {
    font-size: 0.65rem;
    color: #4ecdc4;
}

/* Emoji pixel */
.emoji {
    position: fixed;
    font-size: 2rem;
    animation: spin 4s linear infinite;
    text-shadow: 2px 2px #000;
}

@keyframes spin {
    to {transform: rotate(360deg);}
}

/* Pixel decorations */
.pixel-decoration {
    position: fixed;
    width: 16px;
    height: 16px;
    background: #ff9a76;
    z-index: -1;
    animation: float 6s infinite ease-in-out;
}

.pixel-decoration:nth-child(odd) {
    background: #4ecdc4;
}

.pixel-decoration:nth-child(3n) {
    background: #ffd166;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
}

/* Mobile */
@media(max-width:480px){
    .new-year-title{font-size:1.5rem}
    .big-2026{font-size:2.6rem}
    .typewriter{font-size:1rem}
    .pixel-countdown{gap:8px;}
}
</style>
</head>

<body>
<div class="pixel-background"></div>
<canvas id="pixel-fireworks"></canvas>

<!-- Các pixel decoration -->
<div class="pixel-decoration" style="top:10%;left:5%;"></div>
<div class="pixel-decoration" style="top:15%;right:10%;animation-delay:0.5s"></div>
<div class="pixel-decoration" style="bottom:20%;left:15%;width:12px;height:12px;animation-delay:1s"></div>
<div class="pixel-decoration" style="bottom:10%;right:20%;width:20px;height:20px;animation-delay:1.5s"></div>
<div class="pixel-decoration" style="top:40%;left:8%;width:14px;height:14px;animation-delay:2s"></div>
<div class="pixel-decoration" style="top:60%;right:5%;animation-delay:2.5s"></div>

<div class="emoji" style="top:14px;left:14px">🎉</div>
<div class="emoji" style="bottom:14px;right:14px">🎮</div>

<div class="container">
    <h1 class="new-year-title">CHÚC MỪNG NĂM MỚI</h1>
    <div class="big-2026">2026</div>

    <div class="pixel-frame">
        <div class="typewriter">
            <span class="typewriter-text" id="typewriter-text"></span>
        </div>
    </div>

    <div class="pixel-countdown">
        <div class="countdown-item">
            <div class="countdown-value" id="days">00</div>
            <div class="countdown-label">NGÀY</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-value" id="hours">00</div>
            <div class="countdown-label">GIỜ</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-value" id="minutes">00</div>
            <div class="countdown-label">PHÚT</div>
        </div>
        <div class="countdown-item">
            <div class="countdown-value" id="seconds">00</div>
            <div class="countdown-label">GIÂY</div>
        </div>
    </div>
</div>

<script>
/* Typewriter */
const message = "Chúc Candy năm mới 2026 học giỏi hơn, xinh đẹp hơn và đậu vào ngôi trường mình mong muốn 🎆";
let i = 0;

function typeWriter(){
    const el = document.getElementById("typewriter-text");
    if(i < message.length){
        if(message.slice(i, i+4) === "Trân"){
            el.innerHTML += '<span class="name-highlight">Trân</span>';
            i += 4;
        } else {
            el.innerHTML += message[i];
            i++;
        }
        setTimeout(typeWriter, 50);
    } else {
        el.style.borderRight = "none";
    }
}

/* Countdown */
function updateCountdown(){
    const now = new Date();
    const target = new Date(now.getFullYear()+1,0,1);
    const diff = target - now;

    document.getElementById("days").textContent = Math.floor(diff/86400000);
    document.getElementById("hours").textContent = Math.floor(diff/3600000)%24;
    document.getElementById("minutes").textContent = Math.floor(diff/60000)%60;
    document.getElementById("seconds").textContent = Math.floor(diff/1000)%60;
}

/* Pixel Fireworks */
const canvas = document.getElementById("pixel-fireworks");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const particles = [];
const colors = ["#4ecdc4","#ff9a76","#ffd166","#06d6a0","#ef476f","#118ab2"];

function createPixelParticle(x, y, color, size = 3) {
    return {
        x, y,
        vx: (Math.random()-0.5)*4,
        vy: (Math.random()-0.5)*4 - 2, // Hướng lên
        life: 1,
        color: color,
        size: size,
        gravity: 0.05
    };
}

function boom(){
    const x = Math.random()*canvas.width;
    const y = Math.random()*canvas.height*0.6;
    const color = colors[Math.floor(Math.random()*colors.length)];
    
    // Tạo pháo hoa pixel với nhiều hạt
    for(let i=0; i<24; i++){
        particles.push(createPixelParticle(x, y, color));
    }
    
    // Tạo hiệu ứng tỏa sáng trung tâm
    for(let i=0; i<8; i++){
        particles.push(createPixelParticle(x, y, "#ffffff", 4));
    }
}

function drawPixel(x, y, size, color) {
    // Vẽ pixel vuông với viền đậm hơn
    ctx.fillStyle = color;
    ctx.fillRect(x, y, size, size);
    
    // Thêm hiệu ứng pixel với viền tối hơn
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(x, y, 1, size);
    ctx.fillRect(x, y, size, 1);
    
    // Thêm điểm sáng nhỏ
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.fillRect(x+1, y+1, 1, 1);
}

function animate(){
    // Nền trong suốt để thấy hiệu ứng pháo hoa rõ hơn
    ctx.fillStyle = "rgba(12, 14, 26, 0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Cập nhật và vẽ từng hạt pixel
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity; // Trọng lực
        p.life -= 0.015;
        
        // Giảm kích thước theo thời gian
        const currentSize = Math.max(1, p.size * p.life);
        
        // Độ trong suốt giảm dần
        ctx.globalAlpha = p.life;
        drawPixel(Math.floor(p.x), Math.floor(p.y), Math.floor(currentSize), p.color);
    });
    
    ctx.globalAlpha = 1; // Reset độ trong suốt

    // Xóa các hạt đã hết thời gian sống
    for(let i = particles.length-1; i >= 0; i--){
        if(particles[i].life <= 0) particles.splice(i,1);
    }

    // Thỉnh thoảng tạo pháo hoa mới
    if(Math.random() < 0.04) boom();
    
    requestAnimationFrame(animate);
}

// Tạo pháo hoa ban đầu
function initFireworks() {
    for(let i = 0; i < 3; i++) {
        setTimeout(() => boom(), i * 300);
    }
}

window.onload = () => {
    typeWriter();
    updateCountdown();
    setInterval(updateCountdown, 1000);
    initFireworks();
    animate();
    
    // Thêm sự kiện click để tạo pháo hoa
    canvas.addEventListener("click", function(e) {
        for(let i = 0; i < 20; i++) {
            particles.push(createPixelParticle(e.clientX, e.clientY, colors[i % colors.length]));
        }
    });
};
</script>
</body>
</html>
